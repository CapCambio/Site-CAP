    <!-- Configuração para instalação do PWA -->
    <script>
      // Função para registrar o service worker
      const registerServiceWorker = async () => {
        if (!('serviceWorker' in navigator)) {
          console.log('Navegador não suporta Service Workers');
          return null;
        }
        
        try {
          console.log('Tentando registrar o Service Worker...');
          
          // Força a atualização do service worker em cada carregamento
          const registration = await navigator.serviceWorker.register('/sw.js', {
            scope: '/',
            updateViaCache: 'none'  // Sempre busca a versão mais recente
          });
          
          console.log('Service Worker registrado com sucesso: ', registration.scope);
          
          // Verificar o estado do service worker
          if (registration.installing) {
            console.log('Service Worker está instalando...');
            registration.installing.addEventListener('statechange', (event) => {
              console.log('Estado do Service Worker:', event.target.state);
            });
          } else if (registration.waiting) {
            console.log('Service Worker instalado e esperando...');
          } else if (registration.active) {
            console.log('Service Worker ativo e rodando');
          }
          
          // Forçar atualização do service worker
          registration.update().catch(err => 
            console.log('Erro ao atualizar o Service Worker:', err)
          );
          
          return registration;
        } catch (error) {
          console.error('Falha ao registrar o Service Worker:', error);
          return null;
        }
      };
      
      // Registrar o service worker após o carregamento da página
      window.addEventListener('load', () => {
        // Verificar se estamos em um contexto seguro (HTTPS ou localhost)
        const isLocalhost = window.location.hostname === 'localhost' || 
                          window.location.hostname === '127.0.0.1';
                          
        if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || isLocalhost)) {
          registerServiceWorker().catch(console.error);
        } else {
          console.log('Service Worker não suportado neste ambiente');
        }
      });
      
      // Detecta quando o PWA é instalado
      window.addEventListener('appinstalled', (evt) => {
        console.log('Aplicativo instalado com sucesso!');
        // Aqui você pode adicionar lógica adicional após a instalação
      });
      
      // Detecta se o aplicativo foi aberto a partir da tela inicial
      window.addEventListener('DOMContentLoaded', () => {
        if (window.matchMedia('(display-mode: standalone)').matches || 
            window.navigator.standalone === true || 
            document.referrer.includes('android-app://')) {
          console.log('Aplicativo aberto como PWA');
          // Adicione aqui lógica específica para quando o aplicativo é aberto como PWA
        }
      });
    </script>
