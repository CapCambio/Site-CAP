<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Você está offline | CAP Cotações</title>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background-color: #000000;
      color: #ffffff;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 1rem;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 2rem;
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
      color: #ffffff;
    }
    p {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
      color: #e5e7eb;
    }
    .offline-icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      color: #ef4444;
    }
    .btn {
      display: inline-block;
      background-color: #3b82f6;
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
      transition: background-color 0.2s;
      border: none;
      cursor: pointer;
      font-size: 1rem;
    }
    .btn:hover {
      background-color: #2563eb;
    }
    .btn-outline {
      background-color: transparent;
      border: 1px solid #3b82f6;
      color: #3b82f6;
      margin-left: 0.75rem;
    }
    .btn-outline:hover {
      background-color: rgba(59, 130, 246, 0.1);
    }
    .buttons {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    @media (max-width: 480px) {
      .container {
        padding: 1.5rem;
      }
      h1 {
        font-size: 1.5rem;
      }
      p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="offline-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"></path>
        <path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"></path>
        <path d="M19.1 4.9c3.9 3.9 3.9 10.3 0 14.2"></path>
        <path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"></path>
        <line x1="2" y1="2" x2="22" y2="22"></line>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
    </div>
    <h1>Parece que você está offline</h1>
    <p>Não foi possível carregar o conteúdo. Verifique sua conexão com a internet e tente novamente.</p>
    <div class="buttons">
      <button class="btn" onclick="window.location.reload()">Tentar novamente</button>
      <button class="btn btn-outline" onclick="if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {navigator.serviceWorker.controller.postMessage({action: 'clear-cache'}); window.location.reload();}">Limpar cache</button>
    </div>
  </div>
  <script>
    // Verificar periodicamente se a conexão foi restabelecida
    function checkConnection() {
      if (navigator.onLine) {
        window.location.reload();
      }
    }
    
    // Verificar a cada 5 segundos
    setInterval(checkConnection, 5000);
    
    // Verificar também quando a conexão for restabelecida
    window.addEventListener('online', checkConnection);
    
    // Mensagem para o Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('message', event => {
        if (event.data && event.data.action === 'reload') {
          window.location.reload();
        }
      });
    }
  </script>
</body>
</html>
