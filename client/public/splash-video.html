<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAP Cotações</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .skip-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.3s;
      z-index: 1000;
    }
    .skip-button:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <video
    id="splash"
    src="/splash.mp4"
    autoplay
    muted
    playsinline
    preload="auto"
  ></video>
  <button class="skip-button" id="skipButton">Pular</button>

  <script>
    const video = document.getElementById('splash');
    const skipButton = document.getElementById('skipButton');
    const redirect = () => window.location.replace('/');

    // Verifica se o usuário já viu o splash screen
    const hasSeenSplash = localStorage.getItem('hasSeenSplash');

    if (hasSeenSplash) {
      // Se já viu, redireciona imediatamente
      redirect();
    } else {
      // Se não viu, mostra o splash
      // Redireciona quando o vídeo terminar
      video.addEventListener('ended', () => {
        localStorage.setItem('hasSeenSplash', 'true');
        redirect();
      });

      // Redireciona se ocorrer erro
      video.addEventListener('error', redirect);

      // Timeout de segurança: 5 segundos
      setTimeout(() => {
        localStorage.setItem('hasSeenSplash', 'true');
        redirect();
      }, 5000);

      // Botão de pular
      skipButton.addEventListener('click', () => {
        localStorage.setItem('hasSeenSplash', 'true');
        redirect();
      });
    }
  </script>
</body>
</html>
