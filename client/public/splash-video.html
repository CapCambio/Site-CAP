<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAP Cotações</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <video
    id="splash"
    src="/splash.mp4"
    autoplay
    muted
    playsinline
    preload="auto"
  ></video>

  <script>
    const video = document.getElementById('splash');
    const redirect = () => window.location.replace('/');

    // Redireciona quando o vídeo terminar
    video.addEventListener('ended', redirect);

    // Redireciona se ocorrer erro
    video.addEventListener('error', redirect);

    // Timeout de segurança: 5 segundos
    setTimeout(redirect, 5000);
  </script>
</body>
</html>
