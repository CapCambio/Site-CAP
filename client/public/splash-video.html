<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAP Cotações</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    @media (min-width: 768px) {
      body {
        background: #000000;
      }
      video {
        width: auto;
        height: auto;
        max-width: 60vw;
        max-height: 60vh;
        object-fit: contain;
        border-radius: 12px;
      }
    }
    .skip-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.3s;
      z-index: 1000;
    }
    .skip-button:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <video
    id="splash"
    src="/splash.mp4"
    autoplay
    muted
    playsinline
    preload="auto"
  ></video>
  <button class="skip-button" id="skipButton">Pular</button>

  <script>
    console.log('🎬 Splash screen carregada');

    // Verifica se já exibiu a splash nessa sessão
    if (sessionStorage.getItem('splashShown')) {
      console.log('⏭️ Splash já exibida nesta sessão, redirecionando...');
      window.location.replace('/');
    }

    const video = document.getElementById('splash');
    const skipButton = document.getElementById('skipButton');
    const redirect = () => {
      console.log('🔄 Redirecionando para página principal...');
      sessionStorage.setItem('splashShown', 'true');
      window.location.replace('/');
    };

    console.log('📹 Elemento de vídeo:', video);
    console.log('🎥 Fonte do vídeo:', video?.src);

    // Redireciona quando o vídeo terminar
    video.addEventListener('ended', () => {
      console.log('✅ Vídeo terminou');
      redirect();
    });

    // Redireciona se ocorrer erro
    video.addEventListener('error', (e) => {
      console.error('❌ Erro ao carregar vídeo:', e);
      redirect();
    });

    // Verifica se o vídeo carregou
    video.addEventListener('loadeddata', () => {
      console.log('✅ Vídeo carregado com sucesso');
    });

    // Timeout de segurança: 5 segundos
    setTimeout(() => {
      console.log('⏱️ Timeout de segurança atingido');
      redirect();
    }, 5000);

    // Botão de pular
    skipButton.addEventListener('click', () => {
      console.log('⏭️ Botão de pular clicado');
      redirect();
    });
  </script>
</body>
</html>
