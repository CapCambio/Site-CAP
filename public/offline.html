<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Você está offline - CAP Cotações</title>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      background-color: #000000;
      color: #ffffff;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1.1rem;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .logo {
      max-width: 150px;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-block;
      background-color: #ffffff;
      color: #000000;
      padding: 12px 24px;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .btn:hover {
      background-color: #e0e0e0;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/optimized/cap-logo-fundo-optimized.webp" alt="CAP Cotações" class="logo">
    <h1>Você está offline</h1>
    <p>Parece que você está sem conexão com a internet. Por favor, verifique sua conexão e tente novamente.</p>
    <a href="/" class="btn">Tentar novamente</a>
  </div>
  
  <script>
    // Tenta recarregar a página quando a conexão for restaurada
    function handleConnectionChange() {
      if (navigator.onLine) {
        window.location.reload();
      }
    }
    
    window.addEventListener('online', handleConnectionChange);
    
    // Verifica periodicamente se a conexão foi restaurada
    setInterval(() => {
      if (navigator.onLine) {
        window.location.reload();
      }
    }, 5000);
  </script>
</body>
</html>
