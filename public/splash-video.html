<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CAP Cotações</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        body {
            background: #000;
            overflow: hidden;
            position: relative;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            animation: videoFadeOut 0.5s ease-out 2.5s forwards;
        }
        
        #splashVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            max-width: 80vmin;
            max-height: 80vmin;
        }
        
        .fallback-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            display: none;
        }
        
        @keyframes videoFadeOut {
            0% { 
                opacity: 1; 
                transform: scale(1);
            }
            70% { 
                opacity: 1; 
                transform: scale(1);
            }
            100% { 
                opacity: 0; 
                transform: scale(0.95);
            }
        }
    </style>
</head>
<body>
    <div class="video-container">
        <video id="splashVideo" autoplay muted playsinline>
            <source src="/splash.mp4" type="video/mp4">
            Seu navegador não suporta vídeo.
        </video>
        
        <!-- Logo fallback se vídeo não carregar -->
        <img src="/optimized/cap-logo-fundo-optimized.webp" class="fallback-logo" alt="CAP Câmbio">
    </div>
    
    <script>
        // Garante que o vídeo toque
        const video = document.getElementById('splashVideo');
        
        video.addEventListener('loadeddata', () => {
            video.play().catch(e => {
                console.log('Autoplay bloqueado, tentando com interação:', e);
                // Mostra logo fallback se vídeo não tocar
                document.querySelector('.fallback-logo').style.display = 'block';
                video.style.display = 'none';
            });
        });
        
        // Fallback se vídeo não carregar em 2s
        setTimeout(() => {
            if (video.readyState < 2) {
                document.querySelector('.fallback-logo').style.display = 'block';
                video.style.display = 'none';
            }
        }, 2000);
        
        // Redireciona para o app principal após 3 segundos
        setTimeout(() => {
            window.location.href = '/';
        }, 3000);
    </script>
</body>
</html>
